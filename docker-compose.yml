services:
  api:
    build:
      context: ./backend
    container_name: expense-tracker-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    container_name: expense-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: expense_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U expense_user -d expense_tracker"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: